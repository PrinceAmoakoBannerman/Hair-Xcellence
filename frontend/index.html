<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hair Xcellence — Luxury Human Hair Wigs, Accra</title>
    <meta name="description" content="Shop luxury human hair wigs, bundles and closures, or customise every detail of your wig. Hand-finished in Accra, delivered worldwide." />
    <meta name="theme-color" content="#641D32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Hair Xcellence — Where Beauty Meets Excellence" />
    <meta property="og:description" content="Luxury human hair wigs, hand-finished in Accra." />
    <meta property="og:type" content="website" />
    <!-- Splash loader: inline so it paints before any JS/CSS bundle arrives -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #F5EBDD; transition: opacity .45s ease, visibility .45s ease; }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .mark { position: relative; display: grid; place-items: center; width: 96px; height: 96px; }
      #splash .x { font: normal 600 66px/1 'Bodoni Moda', Didot, Georgia, 'Times New Roman', serif; color: #641D32; animation: splash-breathe 1.4s ease-in-out infinite; }
      #splash .ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(182,154,106,.25); border-top-color: #B69A6A; animation: splash-spin 1s linear infinite; }
      #splash .word { position: absolute; top: calc(50% + 70px); left: 50%; transform: translateX(-50%); font: 600 11px/1 system-ui, sans-serif; letter-spacing: .32em; color: #30231F; white-space: nowrap; opacity: .7; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-breathe { 50% { opacity: .55; transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { #splash .x, #splash .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Hair Xcellence">
      <div class="mark"><span class="ring"></span><span class="x">X</span></div>
      <span class="word">HAIR XCELLENCE</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
